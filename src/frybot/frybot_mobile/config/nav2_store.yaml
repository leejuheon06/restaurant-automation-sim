# FrybotNavigator: Nav2 parameters of one FrybotMobile (Pinky Pro) in the FryBot store
# (tabletop scale: 2 m x 1 m map, 11 x 12 cm robot). Used unchanged in the simulation and on the real robot;
# navigator.launch.py fills in the placeholders:
#   __NS__   robot name (pinky1 ...), the namespace of every topic
#   __FP__   TF frame prefix: "pinky1/" in the simulation (one shared /tf), "" on the robot (its own /pinkyN/tf)
#   __SIM__  true with the simulator clock, false on the robot
#   __BT__   path of segment_bt.xml
#   __MAPTOPIC__  /map in the simulation, /pinkyN/map on the robot (its own map_server); __MAP__ = map yaml file
# The central Task Manager decides the route and the order at shared nodes; Nav2 plans and drives each granted
# segment on the costmaps (static map + inflation globally, lidar obstacles locally) and stops before a collision.
bt_navigator:
  ros__parameters:
    use_sim_time: __SIM__
    global_frame: map
    robot_base_frame: __FP__base_footprint
    odom_topic: /__NS__/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: __BT__
    default_nav_through_poses_bt_xml: __BT__
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: __SIM__
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /__NS__/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.015
      yaw_goal_tolerance: 6.3
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08
      lookahead_dist: 0.06
      min_lookahead_dist: 0.04
      max_lookahead_dist: 0.10
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 6.0
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.3
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.05
      regulated_linear_scaling_min_speed: 0.03
      # The AMR node turns the robot toward each node itself (front for forward driving, rear for reverse) before
      # sending the goal, so the controller only drives. Reversing (guiding, yielding, backing out after a replan)
      # follows the sign of the carrot in the robot frame; RPP does not allow it together with rotate-to-heading.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.4
      allow_reversing: true
      max_robot_pose_search_dist: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: __SIM__
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: __FP__odom
      robot_base_frame: __FP__base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.01
      footprint: "[[0.062, 0.057], [0.062, -0.057], [-0.062, -0.057], [-0.062, 0.057]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /__NS__/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 0.6
          obstacle_min_range: 0.06      # the lidar clamps to 0.05 m: ignore clamped returns
          raytrace_max_range: 0.8
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.07
        cost_scaling_factor: 40.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: __SIM__
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: __FP__base_footprint
      resolution: 0.01
      track_unknown_space: false
      footprint: "[[0.062, 0.057], [0.062, -0.057], [-0.062, -0.057], [-0.062, 0.057]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: __MAPTOPIC__
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.08
        cost_scaling_factor: 30.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: __SIM__
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.02
      use_astar: true
      allow_unknown: false

# ---- localisation, real robot only (the simulation takes the pose from the simulator instead)
map_server:
  ros__parameters:
    use_sim_time: __SIM__
    yaml_filename: "__MAP__"

amcl:
  ros__parameters:
    use_sim_time: __SIM__
    base_frame_id: __FP__base_footprint
    odom_frame_id: __FP__odom
    global_frame_id: map
    scan_topic: /__NS__/scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 0.5      # the whole map is 2 m x 1 m
    laser_max_range: 3.0
    laser_min_range: 0.06
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.02                  # 2 cm / 0.1 rad: the roadmap segments are only 10-30 cm long
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false             # the FrybotMobile Controller sends the initial pose (the robot's home spot)
